version: "3.9"

networks:
  aponti-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"

volumes:
  db-data:
    driver: local

services:

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aponti
      POSTGRES_PASSWORD: aponti_secret
      POSTGRES_DB: aponti
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - aponti-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  product-service:
    image: localhost:5000/aponti/product-service:1.0
    environment:
      NODE_ENV: production
      PORT: 3001
    networks:
      - aponti-net
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  inventory-service:
    image: localhost:5000/aponti/inventory-service:1.0
    environment:
      NODE_ENV: production
      PORT: 3002
    networks:
      - aponti-net
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  order-service:
    image: localhost:5000/aponti/order-service:1.0
    environment:
      NODE_ENV: production
      PORT: 3003
      PRODUCT_SERVICE_URL: http://product-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
    networks:
      - aponti-net
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  api-gateway:
    image: localhost:5000/aponti/api-gateway:1.0
    environment:
      NODE_ENV: production
      PORT: 3000
      PRODUCT_SERVICE_URL: http://product-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    networks:
      - aponti-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 128M
