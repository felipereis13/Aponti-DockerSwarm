# Configuracoes compartilhadas pelos processos Node.js.
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - aponti-net
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - >-
        fetch('http://127.0.0.1:' + process.env.PORT + '/health',
        { signal: AbortSignal.timeout(2000) })
        .then(response => process.exit(response.status === 200 ? 0 : 1))
        .catch(() => process.exit(1));
    start_period: 10s
    interval: 15s
    timeout: 5s
    retries: 3
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M
      reservations: &reserved-resources
        cpus: "0.25"
        memory: 128M

services:
  api-gateway:
    <<: *service-defaults
    image: aponti/api-gateway:1.0
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      PRODUCT_SERVICE_URL: http://product-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    depends_on:
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations: *reserved-resources

  product-service:
    <<: *service-defaults
    image: aponti/product-service:1.0
    build: ./product-service
    container_name: product-service
    environment:
      NODE_ENV: production
      PORT: "3001"

  inventory-service:
    <<: *service-defaults
    image: aponti/inventory-service:1.0
    build: ./inventory-service
    container_name: inventory-service
    environment:
      NODE_ENV: production
      PORT: "3002"

  order-service:
    <<: *service-defaults
    image: aponti/order-service:1.0
    build: ./order-service
    container_name: order-service
    environment:
      NODE_ENV: production
      PORT: "3003"
      PRODUCT_SERVICE_URL: http://product-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
    depends_on:
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

networks:
  aponti-net:
    driver: bridge
